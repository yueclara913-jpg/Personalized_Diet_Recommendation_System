<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录</title><link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}"></head>
<body class="login-page"><form class="login-card" method="post" autocomplete="off"><h1>食品营养数据管理平台</h1><p>管理员安全登录</p>{% if error %}<div class="alert">{{ error }}</div>{% endif %}<input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ request.args.get('next','') }}"><label>用户名<input name="username" maxlength="64" required autocomplete="username"></label><label>密码<input type="password" name="password" maxlength="1024" required autocomplete="current-password"></label><button type="submit">登录</button></form></body></html>
